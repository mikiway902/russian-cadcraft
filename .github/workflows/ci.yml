name: CADCraftGOST CI

# The fork keeps the upstream quality implementation; runner selection and policy are ours.
on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      os: '["ubuntu-24.04","windows-latest","macos-latest"]'
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
      command: |
        # Failed-job logs need authentication even in a public fork. Preserve the real
        # gate status and publish bounded failure context in the public check annotations.
        set +e
        cargo xtask ci 2>&1 | tee "$RUNNER_TEMP/cadcraftgost-gate.log"
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -ne 0 ]; then
          context=$(tail -n 64 "$RUNNER_TEMP/cadcraftgost-gate.log")
          context=${context//%/%25}
          context=${context//$'\r'/%0D}
          context=${context//$'\n'/%0A}
          printf '::error title=CADCraftGOST quality gate::%s\n' "$context"
        fi
        exit "$status"
