# Flatpak manifest for CADCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   python3 flatpak-cargo-generator.py tools/solidcraft-bridge/Cargo.lock -o packaging/linux/flatpak/cargo-worker-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.mikiway902.cadcraftgost.yml
#   flatpak run io.github.mikiway902.cadcraftgost
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from io.github.mikiway902.cadcraftgost.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: io.github.mikiway902.cadcraftgost
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cadcraftgost
finish-args:
  # The shared updater inspects and updates this installation via flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu canvas (Vulkan, or GL as a fallback).
  - --device=dri
  # Outbound network access (HTTPS).
  - --share=network
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents
  # and Pictures are granted so drawings passed by path (the command line, Open Recent, xrefs
  # and images next to a DXF) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Deliberately not granted: home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: cadcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/cadcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p cadcraft -p cadcraft-cli
      - install -Dm755 target/release/cadcraft /app/bin/cadcraftgost
      - install -Dm755 target/release/cadcraft-cli /app/bin/cadcraftgost-cli
      - install -Dm644 packaging/linux/io.github.mikiway902.cadcraftgost.desktop /app/share/applications/io.github.mikiway902.cadcraftgost.desktop
      - install -Dm644 packaging/linux/io.github.mikiway902.cadcraftgost.mime.xml /app/share/mime/packages/io.github.mikiway902.cadcraftgost.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - install -Dm644 NOTICE /app/share/doc/cadcraftgost/NOTICE
      - install -Dm644 ATTRIBUTION.md /app/share/doc/cadcraftgost/ATTRIBUTION.md
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.mikiway902.cadcraftgost.metainfo.xml.in > /app/share/metainfo/io.github.mikiway902.cadcraftgost.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - tools/solidcraft-bridge/target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
  # The exact-model worker keeps a separate Cargo home, source inventory and target directory:
  # combining generated cargo/config files would discard one workspace's git-source mappings.
  - name: cadcraft-model-worker
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/cadcraft-model-worker/cargo
        CARGO_TARGET_DIR: /run/build/cadcraft-model-worker/target
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked --manifest-path tools/solidcraft-bridge/Cargo.toml --bin cadcraft-model-worker --target-dir "$CARGO_TARGET_DIR/model-worker"
      - install -Dm755 "$CARGO_TARGET_DIR/model-worker/release/cadcraft-model-worker" /app/bin/cadcraftgost-model-worker
      - install -d /app/share/doc/cadcraftgost/model-worker-licences
      - cp packaging/model-worker-licences/*.txt /app/share/doc/cadcraftgost/model-worker-licences/
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - tools/solidcraft-bridge/target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-worker-sources.json
